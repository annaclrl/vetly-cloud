<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/head :: head('Cadastro')}"></head>
<body>
<main class="auth-shell py-5" style="align-items: flex-start;">
    <div class="card auth-card" style="max-width: 720px;">
        <div class="card-body p-4 p-sm-5">
            <div class="text-center">
                <span class="auth-logo"><i class="bi bi-heart-pulse-fill" aria-hidden="true"></i></span>
            </div>
            <h1 class="h4 mb-1 text-center">Crie sua conta Vetly</h1>
            <p class="text-muted text-center mb-4">Cadastre-se como tutor de um animal ou como veterinário.</p>

            <ul class="nav nav-tabs mb-4" id="tipoCadastro" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="tab-tutor-btn" data-bs-toggle="tab" data-bs-target="#tab-tutor"
                            type="button" role="tab">Sou Tutor</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tab-vet-btn" data-bs-toggle="tab" data-bs-target="#tab-vet"
                            type="button" role="tab">Sou Veterinário</button>
                </li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="tab-tutor" role="tabpanel">
                    <form th:action="@{/mvc/cadastro/tutor}" th:object="${tutorForm}" method="post">
                        <div th:replace="~{fragments/form-errors :: globalErrors}"></div>
                        <div class="mb-3">
                            <label class="form-label">Nome completo</label>
                            <input class="form-control" th:field="*{nome}" th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">E-mail</label>
                                <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Senha</label>
                                <input class="form-control" type="password" th:field="*{senha}" th:errorclass="is-invalid"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">CPF</label>
                                <input class="form-control" th:field="*{cpf}" th:errorclass="is-invalid" placeholder="somente números"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Telefone</label>
                                <input class="form-control" th:field="*{telefone}" th:errorclass="is-invalid" placeholder="(11) 91234-5678"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                            </div>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Cadastrar como Tutor</button>
                    </form>
                </div>

                <div class="tab-pane fade" id="tab-vet" role="tabpanel">
                    <form th:action="@{/mvc/cadastro/veterinario}" th:object="${veterinarioForm}" method="post">
                        <div th:replace="~{fragments/form-errors :: globalErrors}"></div>
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label">Nome completo</label>
                                <input class="form-control" th:field="*{nome}" th:errorclass="is-invalid"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">CRMV</label>
                                <input class="form-control" th:field="*{crmv}" th:errorclass="is-invalid"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('crmv')}" th:errors="*{crmv}"></div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">E-mail</label>
                                <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Senha</label>
                                <input class="form-control" type="password" th:field="*{senha}" th:errorclass="is-invalid"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">CPF</label>
                                <input class="form-control" th:field="*{cpf}" th:errorclass="is-invalid" placeholder="somente números"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Telefone</label>
                                <input class="form-control" th:field="*{telefone}" th:errorclass="is-invalid" placeholder="(11) 91234-5678"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Especialidades (selecione uma ou mais)</label>
                            <div class="row row-cols-2 row-cols-md-3 g-2 border rounded p-2"
                                 th:classappend="${#fields.hasErrors('especialidades')} ? 'border-danger'">
                                <div class="col" th:each="e : ${especialidadesDisponiveis}">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" th:field="*{especialidades}" th:value="${e.name()}"/>
                                        <label class="form-check-label" th:for="${#ids.prev('especialidades')}" th:text="${#strings.replace(e.name(), 'MEDICINA_ANIMAIS_SELVAGENS', 'ANIMAIS_SELVAGENS')}"></label>
                                    </div>
                                </div>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('especialidades')}" th:errors="*{especialidades}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Espécies atendidas (selecione uma ou mais)</label>
                            <div class="row row-cols-2 row-cols-md-3 g-2 border rounded p-2"
                                 th:classappend="${#fields.hasErrors('especies')} ? 'border-danger'">
                                <div class="col" th:each="e : ${especiesDisponiveis}">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" th:field="*{especies}" th:value="${e.name()}"/>
                                        <label class="form-check-label" th:for="${#ids.prev('especies')}" th:text="${e.name()}"></label>
                                    </div>
                                </div>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('especies')}" th:errors="*{especies}"></div>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Cadastrar como Veterinário</button>
                    </form>
                </div>
            </div>

            <p class="text-center mt-4 mb-0">
                <a th:href="@{/mvc/login}">Já tenho conta — entrar</a>
            </p>
        </div>
    </div>
</main>
</body>
</html>
