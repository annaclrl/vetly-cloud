<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Editar especialidade')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container pb-5" style="max-width:500px">
    <h1 class="h3 mb-3">Editar especialidade</h1>
    <form th:action="@{/mvc/especialidades/{id}/editar(id=${especialidade.id})}" method="post">
        <div class="mb-3">
            <label class="form-label">Nome</label>
            <select class="form-select" name="nome" required>
                <option th:each="n : ${nomesDisponiveis}" th:value="${n}" th:text="${n}" th:selected="${n == especialidade.nome}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <input class="form-control" name="descricao" maxlength="150" th:value="${especialidade.descricao}" required/>
        </div>
        <button class="btn btn-primary" type="submit">Salvar</button>
        <a class="btn btn-link" th:href="@{/mvc/especialidades}">Cancelar</a>
    </form>
</main>
</body>
</html>
