<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4" aria-label="Navegação principal">
    <div class="container-fluid">
        <a class="navbar-brand" sec:authorize="hasRole('ADMIN')" th:href="@{/mvc/}"><i class="bi bi-heart-pulse-fill" aria-hidden="true"></i>Vetly</a>
        <a class="navbar-brand" sec:authorize="hasRole('TUTOR')" th:href="@{/mvc/area-tutor}"><i class="bi bi-heart-pulse-fill" aria-hidden="true"></i>Vetly</a>
        <a class="navbar-brand" sec:authorize="hasRole('VETERINARIO')" th:href="@{/mvc/area-veterinario}"><i class="bi bi-heart-pulse-fill" aria-hidden="true"></i>Vetly</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navVetly"
                aria-controls="navVetly" aria-expanded="false" aria-label="Alternar navegação">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navVetly">
            <ul class="navbar-nav me-auto" sec:authorize="hasRole('ADMIN')">
                <li class="nav-item"><a class="nav-link" th:href="@{/mvc/tutores}"><i class="bi bi-people me-1" aria-hidden="true"></i>Tutores</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/mvc/veterinarios}"><i class="bi bi-person-badge me-1" aria-hidden="true"></i>Veterinários</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/mvc/animais}"><i class="bi bi-emoji-smile me-1" aria-hidden="true"></i>Animais</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/mvc/consultas}"><i class="bi bi-calendar-check me-1" aria-hidden="true"></i>Consultas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/mvc/exames}"><i class="bi bi-clipboard2-pulse me-1" aria-hidden="true"></i>Exames</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/mvc/especies}"><i class="bi bi-diagram-3 me-1" aria-hidden="true"></i>Espécies</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/mvc/especialidades}"><i class="bi bi-award me-1" aria-hidden="true"></i>Especialidades</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/mvc/usuarios}"><i class="bi bi-person-gear me-1" aria-hidden="true"></i>Usuários</a></li>
            </ul>
            <ul class="navbar-nav me-auto" sec:authorize="hasRole('TUTOR')">
                <li class="nav-item"><a class="nav-link" th:href="@{/mvc/area-tutor}"><i class="bi bi-house-door me-1" aria-hidden="true"></i>Minha área</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/mvc/area-tutor/animais}"><i class="bi bi-emoji-smile me-1" aria-hidden="true"></i>Meus animais</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/mvc/area-tutor/consultas}"><i class="bi bi-calendar-check me-1" aria-hidden="true"></i>Minhas consultas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/mvc/area-tutor/exames}"><i class="bi bi-clipboard2-pulse me-1" aria-hidden="true"></i>Meus exames</a></li>
            </ul>
            <ul class="navbar-nav me-auto" sec:authorize="hasRole('VETERINARIO')">
                <li class="nav-item"><a class="nav-link" th:href="@{/mvc/area-veterinario}"><i class="bi bi-house-door me-1" aria-hidden="true"></i>Minha área</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/mvc/area-veterinario/consultas}"><i class="bi bi-calendar-check me-1" aria-hidden="true"></i>Minhas consultas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/mvc/area-veterinario/exames}"><i class="bi bi-clipboard2-pulse me-1" aria-hidden="true"></i>Exames</a></li>
            </ul>
            <span class="navbar-user me-lg-3 my-2 my-lg-0" th:if="${usuarioLogado != null}">
                <i class="bi bi-person-circle" aria-hidden="true"></i><span th:text="${usuarioLogado}"></span>
            </span>
            <form th:action="@{/mvc/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-light btn-sm" type="submit"><i class="bi bi-box-arrow-right" aria-hidden="true"></i>Sair</button>
            </form>
        </div>
    </div>
    <script>
        (function () {
            var norm = function (p) { return p.replace(/\/$/, ''); };
            var path = norm(location.pathname), best = null, bestLen = -1;
            document.querySelectorAll('#navVetly .nav-link').forEach(function (a) {
                var href = norm(a.pathname);
                if ((path === href || path.indexOf(href + '/') === 0) && href.length > bestLen) { best = a; bestLen = href.length; }
            });
            if (best) { best.classList.add('active'); best.setAttribute('aria-current', 'page'); }
        })();
    </script>
</nav>
</body>
</html>
