<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Painel')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container pb-5">
    <h1 class="h3 mb-4">Painel</h1>
    <div class="row g-3">
        <div class="col-6 col-md-3">
            <a class="card text-decoration-none text-reset h-100" th:href="@{/mvc/tutores}">
                <div class="card-body"><div class="text-muted small">Tutores</div><div class="h3" th:text="${totalTutores}">0</div></div>
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a class="card text-decoration-none text-reset h-100" th:href="@{/mvc/veterinarios}">
                <div class="card-body"><div class="text-muted small">Veterinários</div><div class="h3" th:text="${totalVeterinarios}">0</div></div>
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a class="card text-decoration-none text-reset h-100" th:href="@{/mvc/animais}">
                <div class="card-body"><div class="text-muted small">Animais</div><div class="h3" th:text="${totalAnimais}">0</div></div>

        <div class="col-6 col-md-3">
            <a class="card text-decoration-none text-reset h-100" th:href="@{/mvc/consultas}">

        <div class="col-6 col-md-3">
            <a class="card text-decoration-none text-reset h-100" th:href="@{/mvc/exames}">

            </a>
        </div>
        <div class="col-6 col-md-3">
            <a class="card text-decoration-none text-reset h-100" th:href="@{/mvc/especies}">
                <div class="card-body"><div class="text-muted small">Espécies</div><div class="h3" th:text="${totalEspecies}">0</div></div>
            </a>
        </div>
        <div class="col-6 col-md-3">

            </a>
        </div>
        <div class="col-6 col-md-3">
            <a class="card text-decoration-none text-reset h-100" th:href="@{/mvc/usuarios}">
