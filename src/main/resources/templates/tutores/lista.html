<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Tutores')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Tutores</h1>
        <a class="btn btn-primary" th:href="@{/mvc/tutores/novo}">Novo tutor</a>
    </div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <table class="table table-hover align-middle">
        <thead><tr><th>Nome</th><th>Email</th><th>Telefone</th><th>LGPD</th><th>Rede</th><th></th></tr></thead>
        <tbody>
        <tr th:each="tutor : ${tutores}">
            <td th:text="${tutor.pessoa.nome}"></td>
            <td th:text="${tutor.usuario.email}"></td>
            <td th:text="${tutor.pessoa.telefone}"></td>
            <td th:text="${tutor.lgpdAceito} ? 'Sim' : 'Não'"></td>
            <td th:text="${tutor.consentimentoRede} ? 'Sim' : 'Não'"></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/mvc/tutores/{id}(id=${tutor.id})}">Ver</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tutores)}"><td colspan="6" class="text-muted text-center py-4">Nenhum tutor cadastrado.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
