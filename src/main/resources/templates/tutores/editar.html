<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Editar tutor')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container pb-5" style="max-width:600px">
    <h1 class="h3 mb-3">Editar tutor</h1>
    <form th:action="@{/mvc/tutores/{id}/editar(id=${tutor.id})}" th:object="${form}" method="post">
        <div th:replace="~{fragments/form-errors :: globalErrors}"></div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control" th:value="${tutor.usuario.email}" disabled/>
        </div>
        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input class="form-control" th:field="*{nome}" th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input class="form-control" th:field="*{telefone}" th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" th:field="*{lgpdAceito}" id="lgpdAceito"/>
            <label class="form-check-label" for="lgpdAceito">LGPD aceito</label>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" th:field="*{consentimentoRede}" id="consentimentoRede"/>
            <label class="form-check-label" for="consentimentoRede">Consentimento de rede (Colmeia)</label>
        </div>
        <button class="btn btn-primary" type="submit">Salvar</button>
        <a class="btn btn-link" th:href="@{/mvc/tutores/{id}(id=${tutor.id})}">Cancelar</a>
    </form>
</main>
</body>
</html>
