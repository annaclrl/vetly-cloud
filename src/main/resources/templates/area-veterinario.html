<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Área do Veterinário')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container pb-5">
    <h1 class="h3 mb-1">Minha área</h1>
    <p class="text-muted mb-4" th:if="${veterinario != null}"
       th:text="'Dr(a). ' + ${veterinario.pessoa.nome} + ' · CRMV ' + ${veterinario.crmv}"></p>

    <div class="alert alert-warning" th:if="${veterinario == null}">
        Nenhum cadastro de veterinário associado a este usuário.
    </div>

    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <a class="card text-decoration-none text-reset h-100" th:href="@{/mvc/area-veterinario/consultas}">
                <div class="card-body"><div class="text-muted small">Minhas consultas</div><div class="h3" th:text="${#lists.size(consultas)}">0</div></div>
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a class="card text-decoration-none text-reset h-100" th:href="@{/mvc/area-veterinario/exames}">
                <div class="card-body"><div class="text-muted small">Exames</div><div class="h6 pt-2">Ver solicitações</div></div>
            </a>
        </div>
    </div>

    <h2 class="h5">Minhas consultas</h2>
    <table class="table table-sm">
        <thead><tr><th>Data</th><th>Animal</th><th>Status</th></tr></thead>
        <tbody>
            <tr th:each="c : ${consultas}">
                <td th:text="${#temporals.format(c.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                <td><a th:href="@{/mvc/area-veterinario/consultas/{id}(id=${c.id})}" th:text="${c.animal.nome}"></a></td>
                <td th:text="${c.status}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(consultas)}"><td colspan="3" class="text-muted">Nenhuma consulta.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
