<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Meus animais')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Meus animais</h1>
        <a class="btn btn-primary" th:href="@{/mvc/area-tutor/animais/novo}">Novo animal</a>
    </div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <table class="table table-hover align-middle">
        <thead><tr><th>Nome</th><th>Espécie</th><th>Raça</th><th></th></tr></thead>
        <tbody>
        <tr th:each="animal : ${animais}">
            <td th:text="${animal.nome}"></td>
            <td th:text="${animal.especie.nome}"></td>
            <td th:text="${animal.raca}"></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/mvc/area-tutor/animais/{id}(id=${animal.id})}">Ver</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(animais)}"><td colspan="4" class="text-muted text-center py-4">Nenhum animal cadastrado.</td></tr>
        </tbody>
    </table>
    <a th:href="@{/mvc/area-tutor}">← Voltar</a>
</main>
</body>
</html>
