<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Área do Tutor')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container pb-5">
    <h1 class="h3 mb-1">Minha área</h1>
    <p class="text-muted mb-4" th:if="${tutor != null}" th:text="'Tutor: ' + ${tutor.pessoa.nome}"></p>

    <div class="alert alert-warning" th:if="${tutor == null}">
        Nenhum cadastro de tutor associado a este usuário.
    </div>

    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <a class="card text-decoration-none text-reset h-100" th:href="@{/mvc/area-tutor/animais}">
                <div class="card-body"><div class="text-muted small">Meus animais</div><div class="h3" th:text="${#lists.size(animais)}">0</div></div>
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a class="card text-decoration-none text-reset h-100" th:href="@{/mvc/area-tutor/consultas}">
                <div class="card-body"><div class="text-muted small">Minhas consultas</div><div class="h3" th:text="${#lists.size(consultas)}">0</div></div>
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a class="card text-decoration-none text-reset h-100" th:href="@{/mvc/area-tutor/exames}">
                <div class="card-body"><div class="text-muted small">Meus exames</div><div class="h6 pt-2">Ver solicitações</div></div>
            </a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="h5">Meus animais</h2>
                <a class="btn btn-sm btn-primary" th:href="@{/mvc/area-tutor/animais/novo}">Novo animal</a>
            </div>
            <table class="table table-sm">
                <thead><tr><th>Nome</th><th>Espécie</th><th>Raça</th></tr></thead>
                <tbody>
                    <tr th:each="a : ${animais}">
                        <td><a th:href="@{/mvc/area-tutor/animais/{id}(id=${a.id})}" th:text="${a.nome}"></a></td>
                        <td th:text="${a.especie != null ? a.especie.nome : ''}"></td>
                        <td th:text="${a.raca}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(animais)}"><td colspan="3" class="text-muted">Nenhum animal cadastrado.</td></tr>
                </tbody>
            </table>
        </div>
        <div class="col-md-6">
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="h5">Minhas consultas</h2>
                <a class="btn btn-sm btn-primary" th:href="@{/mvc/area-tutor/consultas/novo}">Agendar consulta</a>
            </div>
            <table class="table table-sm">
                <thead><tr><th>Data</th><th>Animal</th><th>Status</th></tr></thead>
                <tbody>
                    <tr th:each="c : ${consultas}">
                        <td th:text="${#temporals.format(c.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td><a th:href="@{/mvc/area-tutor/consultas/{id}(id=${c.id})}" th:text="${c.animal.nome}"></a></td>
                        <td th:text="${c.status}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(consultas)}"><td colspan="3" class="text-muted">Nenhuma consulta.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
