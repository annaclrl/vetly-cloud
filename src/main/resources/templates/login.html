<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body class="bg-light">
<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh">
    <div class="card shadow-sm" style="width: 100%; max-width: 380px;">
        <div class="card-body p-4">
            <h1 class="h4 mb-3 text-center">Vetly · Área administrativa</h1>
            <div class="alert alert-danger" th:if="${param.erro}">Email ou senha inválidos.</div>
            <div class="alert alert-success" th:if="${param.logout}">Sessão encerrada.</div>
            <form th:action="@{/mvc/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Email</label>
                    <input class="form-control" type="email" id="username" name="username" required autofocus/>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Senha</label>
                    <input class="form-control" type="password" id="password" name="password" required/>
                </div>
                <button class="btn btn-primary w-100" type="submit">Entrar</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
