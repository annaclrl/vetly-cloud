spring.application.name=vetly-java

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# O schema do usuario FIAP ja existe com as tabelas de DDL.txt criadas manualmente antes do Flyway
# entrar no projeto. baseline-on-migrate marca esse estado atual como V1 sem reexecutar o CREATE TABLE,
# e so aplica de V2 em diante. Um schema novo/vazio (ex.: outro ambiente) executa V1 normalmente.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=8
spring.flyway.baseline-description=Baseline - schema existente

# Flyway passa a ser a unica fonte de verdade do schema; Hibernate so valida, nunca gera DDL.
spring.jpa.hibernate.ddl-auto=validate

logging.level.org.springframework.security=INFO

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Cria o primeiro ADMIN no startup se nenhum ainda existir (ver AdminBootstrap) —
# sem isso ninguem consegue logar em /mvc/login num banco novo. So roda uma vez;
# depois de criado, mude a senha direto no banco (nao ha tela pra isso ainda).
vetly.admin.bootstrap.email=${VETLY_ADMIN_BOOTSTRAP_EMAIL}
vetly.admin.bootstrap.senha=${VETLY_ADMIN_BOOTSTRAP_SENHA}

# Login com Google (OAuth2/OIDC). Redirect URI padrao do Spring: /login/oauth2/code/google
# Credenciais vem de variaveis de ambiente (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_SCOPE).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_SCOPE:openid,email,profile}
