spring.application.name=vetly-java

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# O schema Oracle e gerenciado manualmente via SQL.
# O Hibernate nao cria, altera nem valida a estrutura do banco.
spring.jpa.hibernate.ddl-auto=none

logging.level.org.springframework.security=INFO

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

vetly.admin.bootstrap.email=${ADMIN_EMAIL}
vetly.admin.bootstrap.senha=${ADMIN_PASSWORD}