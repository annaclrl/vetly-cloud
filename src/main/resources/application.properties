spring.application.name=vetly-java

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# O schema Oracle da FIAP ja possui a estrutura inicial do Vetly.
# O Flyway utiliza o baseline para reconhecer esse estado inicial
# e controlar apenas as alteracoes posteriores do banco.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Baseline - schema inicial do Vetly

# O Flyway e responsavel pelo controle da estrutura do banco.
# O Hibernate apenas valida se as entidades Java correspondem
# ao schema existente, sem criar ou alterar tabelas.
spring.jpa.hibernate.ddl-auto=validate

logging.level.org.springframework.security=INFO

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

vetly.admin.bootstrap.email=${ADMIN_EMAIL}
vetly.admin.bootstrap.senha=${ADMIN_PASSWORD}